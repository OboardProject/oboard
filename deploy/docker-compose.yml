services:
  controller:
    image: "${OBOARD_IMAGE:-ghcr.io/oboardproject/oboard}:${OBOARD_TAG:-latest}"
    container_name: oboard-controller
    restart: unless-stopped
    ports:
      - "${OBOARD_PORT:-2787}:2787"
    environment:
      OBOARD_SESSION_SECRET: "${OBOARD_SESSION_SECRET:?set OBOARD_SESSION_SECRET in .env}"
      OBOARD_BASE_PATH: "${OBOARD_BASE_PATH:-}"
      OBOARD_ADMIN_USERNAME: "${OBOARD_ADMIN_USERNAME:-admin}"
      OBOARD_ADMIN_PASSWORD: "${OBOARD_ADMIN_PASSWORD:?set OBOARD_ADMIN_PASSWORD in .env}"
      OBOARD_AUTO_ADMIN: "true"
      OBOARD_INSTALL_METHOD: "docker"
      OBOARD_UPDATE_CHANNEL: "${OBOARD_TAG:-latest}"
      OBOARD_BACKUP_DIR: "/app/data/backups"
      OBOARD_CONTROLLER_UPDATER_SOCKET: "/run/oboard/controller-updater.sock"
      TZ: "${TZ:-Asia/Shanghai}"
    group_add:
      - "${OBOARD_UPDATER_GID:?set OBOARD_UPDATER_GID in .env}"
    volumes:
      - ./data:/app/data
      - /run/oboard:/run/oboard:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
