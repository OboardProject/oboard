name: Prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease version matching VERSION, for example 0.2.0-rc.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: controller-prerelease-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prerelease:
    name: Build and publish prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: agent-token
        with:
          client-id: ${{ vars.OBOARD_RELEASE_APP_ID }}
          private-key: ${{ secrets.OBOARD_RELEASE_APP_PRIVATE_KEY }}
          owner: OboardProject
          repositories: oboard-agent
      - name: Validate prerelease version and compute metadata
        id: meta
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$version" != "${{ inputs.version }}" ]; then
            echo "VERSION file is $version but workflow input is ${{ inputs.version }}" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "Prereleases require VERSION=x.y.z-(alpha|beta|rc).n" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "build=$(date -u +%Y%m%d%H%M%S)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - name: Enforce immutable release targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.meta.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 || gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists and releases are immutable" >&2
            exit 1
          fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test Controller and release build inputs
        run: ./scripts/verify-release.sh
      - name: Build Controller with matching immutable Agent release
        env:
          GH_TOKEN: ${{ steps.agent-token.outputs.token }}
          OBOARD_RELEASE_PUBLIC_KEY: ${{ vars.OBOARD_RELEASE_PUBLIC_KEY }}
          OBOARD_AGENT_CHANNEL: release
          OBOARD_RELEASE_CHANNEL: prerelease
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ steps.meta.outputs.date }}
          OUT_DIR: ${{ runner.temp }}/oboard/controller/release
        run: ./scripts/build-release.sh
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_RELEASE_DIR: ${{ runner.temp }}/oboard/controller/release
        run: gh release create "v${{ steps.meta.outputs.version }}" "$CONTROLLER_RELEASE_DIR"/*.tar.gz "$CONTROLLER_RELEASE_DIR"/sha256sums.txt "$CONTROLLER_RELEASE_DIR"/controller-release-manifest.json --target "$GITHUB_SHA" --title "OBoard v${{ steps.meta.outputs.version }}" --prerelease --generate-notes
