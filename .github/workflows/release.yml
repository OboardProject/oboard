name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version matching VERSION, for example 0.2.0
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish stable release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: agent-token
        with:
          app-id: ${{ vars.OBOARD_RELEASE_APP_ID }}
          private-key: ${{ secrets.OBOARD_RELEASE_APP_PRIVATE_KEY }}
          owner: OboardProject
          repositories: oboard-agent
      - name: Validate stable version and compute metadata
        id: meta
        shell: bash
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$version" != "${{ inputs.version }}" ]; then
            echo "VERSION file is $version but workflow input is ${{ inputs.version }}" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable releases require VERSION=x.y.z" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "build=$(date -u +%Y%m%d%H%M%S)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Verify Controller release inputs
        run: ./scripts/verify-release.sh
      - name: Build Controller with matching immutable Agent release
        env:
          GH_TOKEN: ${{ steps.agent-token.outputs.token }}
          OBOARD_RELEASE_PUBLIC_KEY: ${{ vars.OBOARD_RELEASE_PUBLIC_KEY }}
          OBOARD_AGENT_CHANNEL: release
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ steps.meta.outputs.date }}
        run: ./scripts/build-release.sh
      - name: Prepare Docker payload
        run: ./scripts/prepare-docker-downloads.sh
      - name: Read bundled Agent metadata
        id: agent
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          metadata = json.load(open("dist/release/agent-release/release-metadata.json"))
          for key in ("version", "build", "commit", "date"):
              print(f"{key}={metadata[key]}")
          PY
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile.controller
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD=${{ steps.meta.outputs.build }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
            RELEASE_PUBLIC_KEY=${{ vars.OBOARD_RELEASE_PUBLIC_KEY }}
            AGENT_VERSION=${{ steps.agent.outputs.version }}
            AGENT_BUILD=${{ steps.agent.outputs.build }}
            AGENT_COMMIT=${{ steps.agent.outputs.commit }}
            AGENT_DATE=${{ steps.agent.outputs.date }}
            KERNEL_VERSION=${{ steps.agent.outputs.version }}
            KERNEL_BUILD=${{ steps.agent.outputs.build }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create immutable git tag
        run: |
          tag="v${{ steps.meta.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists and releases are immutable" >&2
            exit 1
          fi
          git config user.name OboardProject
          git config user.email OboardProject@users.noreply.github.com
          git tag -a "$tag" -m "OBoard $tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.meta.outputs.version }}" dist/release/*.tar.gz dist/release/sha256sums.txt --title "OBoard v${{ steps.meta.outputs.version }}" --latest --generate-notes
