name: Development build

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: controller-dev-release
  cancel-in-progress: true

jobs:
  build:
    name: Build development artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: agent-token
        with:
          client-id: ${{ vars.OBOARD_RELEASE_APP_ID }}
          private-key: ${{ secrets.OBOARD_RELEASE_APP_PRIVATE_KEY }}
          owner: OboardProject
          repositories: oboard-agent
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test Controller and release build inputs
        run: ./scripts/verify-release.sh
      - name: Compute development metadata
        id: meta
        shell: bash
        run: |
          {
            echo "version=dev-${GITHUB_SHA::12}"
            echo "build=$(date -u +%Y%m%d%H%M%S)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve Agent development commit
        id: agent
        shell: bash
        env:
          GH_TOKEN: ${{ steps.agent-token.outputs.token }}
        run: |
          commit=""
          for attempt in 1 2 3; do
            if commit=$(gh api repos/OboardProject/oboard-agent/commits/main --jq .sha) && [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              break
            fi
            commit=""
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve the Agent main commit after 3 attempts" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Build Controller with latest Agent development release
        env:
          GH_TOKEN: ${{ steps.agent-token.outputs.token }}
          OBOARD_RELEASE_PUBLIC_KEY: ${{ vars.OBOARD_RELEASE_PUBLIC_KEY }}
          OBOARD_AGENT_CHANNEL: dev
          OBOARD_AGENT_EXPECTED_COMMIT: ${{ steps.agent.outputs.commit }}
          OBOARD_RELEASE_CHANNEL: dev
          OBOARD_ARTIFACT_VERSION: dev
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ steps.meta.outputs.date }}
          OUT_DIR: ${{ runner.temp }}/oboard/controller/release
        run: ./scripts/build-release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oboard-dev-${{ steps.meta.outputs.version }}
          path: |
            ${{ runner.temp }}/oboard/controller/release/*.tar.gz
            ${{ runner.temp }}/oboard/controller/release/sha256sums.txt
            ${{ runner.temp }}/oboard/controller/release/controller-release-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish mutable development release
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_RELEASE_DIR: ${{ runner.temp }}/oboard/controller/release
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push --force origin refs/tags/dev
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev \
              "$CONTROLLER_RELEASE_DIR"/*.tar.gz \
              "$CONTROLLER_RELEASE_DIR"/sha256sums.txt \
              "$CONTROLLER_RELEASE_DIR"/controller-release-manifest.json \
              --clobber
            gh release edit dev \
              --title "OBoard development build" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --notes "Mutable development build from $GITHUB_SHA."
          else
            gh release create dev \
              "$CONTROLLER_RELEASE_DIR"/*.tar.gz \
              "$CONTROLLER_RELEASE_DIR"/sha256sums.txt \
              "$CONTROLLER_RELEASE_DIR"/controller-release-manifest.json \
              --title "OBoard development build" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --notes "Mutable development build from $GITHUB_SHA."
          fi
