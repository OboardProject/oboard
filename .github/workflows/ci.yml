name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test Controller and Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify Controller release inputs
        run: ./scripts/verify-release.sh
      - name: Verify Go module and vet
        run: |
          go mod verify
          go vet ./...
      - name: Run Go race tests
        run: go test -race -shuffle=on ./...
      - name: Install pinned security scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: Scan Go code
        run: |
          govulncheck ./...
          gosec -exclude-generated ./...
          staticcheck -checks=all,-ST1000,-ST1005 ./...
