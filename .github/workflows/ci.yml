name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test Controller and Web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test Controller and release build inputs
        run: ./scripts/verify-release.sh
      - name: Verify Go module and vet
        run: |
          go mod verify
          go vet ./...
      - name: Run Go race tests
        run: go test -race -shuffle=on ./...
      - name: Install pinned security scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: Scan Go code
        run: |
          govulncheck ./...
          gosec -exclude-generated ./...
          staticcheck -checks=all,-ST1000,-ST1005 ./...
